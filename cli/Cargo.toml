[package]
name = "tonesend-cli"
description = "ToneSend CLI: encode/decode WAV, channel simulation, benchmarks"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "tonesend"
path = "src/main.rs"

[dependencies]
modem = { path = "../core" }
audio = { path = "../audio" }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
