name: ToneSend
options:
  bundleIdPrefix: cz.ittailors
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ToneSend:
    type: application
    platform: iOS
    sources:
      - path: App
    preBuildScripts:
      - name: Build Rust modem
        script: |
          "${PROJECT_DIR}/../scripts/build-ios.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.ittailors.soundtransfer
        PRODUCT_NAME: ToneSend
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ToneSend
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ToneSend listens for data that a nearby device sends as sound."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo to send as sound."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UVQY92AUN6
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_INCLUDE_PATHS: '"$(PROJECT_DIR)/../ffi/include"'
        OTHER_LDFLAGS: -ltonesend
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": '"$(PROJECT_DIR)/../target/aarch64-apple-ios/release"'
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": '"$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release"'
